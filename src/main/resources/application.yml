spring:
  application:
    name: agent-system

  datasource:
    url: jdbc:postgresql://localhost:5432/public_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view : false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  servlet:
    session:
      timeout: 30m          # 30분 동안 요청이 없으면 자동 로그아웃
      cookie:
        http-only: true     # JavaScript로 세션 쿠키를 읽을 수 없게 (XSS 대비)
        same-site: lax      # 다른 사이트에서 보낸 요청에는 쿠키를 붙이지 않음 (CSRF 대비)
